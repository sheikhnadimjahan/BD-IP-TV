kind = "web"
previewPath = "/"
title = "Banglar Darpan LIVE"
description = "A Bengali live news viewer that brings together the default channel lineup and lets viewers preview custom YouTube, HLS, and MP4 sources in one focused web experience."
version = "1.0.0"
id = "artifacts/banglar-darpan-live"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21411

[services.development]
run = "pnpm --filter @workspace/banglar-darpan-live run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/banglar-darpan-live", "run", "build" ]
serve = "static"
publicDir = "artifacts/banglar-darpan-live/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21411"
BASE_PATH = "/"
